<!DOCTYPE html> <!--html5 dokument-->

<html lang="sv"> <!--språk: svenska-->
    <head> 
        <meta charset="UTF-8"> <!--teckenkodning: UTF-8-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--för responsiv design-->
        <link href="styles/style.css" rel="stylesheet" /> <!--länkar till CSS-filen-->
        <title>Samlingssida för recept</title> <!--titel som visas i webbläsarens flik-->
        <link rel="icon" type="image/x-icon" href="images/favicon.ico"> <!--favicon som visas i webbläsarens flik-->
        <link rel="preconnect" href="https://fonts.googleapis.com"> <!--för att optimera laddning av Google Fonts-->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!--för att optimera laddning av Google Fonts-->
        <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet"> <!--länkar till Google Font "Special Elite"-->
        <link href=".output.css" rel="stylesheet"> <!--länkar till Tailwind CSS-utdata-->
    </head>
    <body>
        <div class="content"> <!--omslutande div för hela innehållet, används för att centrera och ge padding-->
            <header> <!--huvudsektion som innehåller bannerbild, titel och introduktion-->
                <picture> <!--för att visa olika bilder beroende på skärmstorlek-->
                    <source srcset="images/banner_mobile.png" media="(max-width: 400px)"> <!--bild för mobila enheter-->
                    <source srcset="images/banner.png"  media="(max-width: 1199px)"> <!--bild för surfplattor och skärmar-->
                    <img src="images/banner_recipies.png" class="img-banner" alt=""> <!--standardbild som visas om inga av de andra källorna matchar, med en klass för styling-->
                </picture>
                <h1>En samlingssida för recept</h1> <!--huvudrubrik för sidan-->
                <p class="header__description">Här hittar du en samling av olika recept som du kan prova hemma.</p> <!--introduktionstext med en klass för styling-->
            </header>
            <main class="main"> <!--huvudinnehåll som innehåller receptet, med en klass för styling-->
                <article> <!--artikel som innehåller alla sektioner av receptet-->
                    <section class="container"> <!--sektion för ingredienser-->
                        <figure class="cards">
                            <a href="index.html">
                                <img src="images/pancakes.png" alt="Recept 1: Pannkakor"> <!--bild som representerar receptet-->
                                <figcaption>Recept 1: Pannkakor</figcaption> <!--bildtext som beskriver receptet-->
                            </a>
                        </figure>
                        <figure class="cards">
                            <a href="index.html"> <!--länk som pekar på index.html, som innehåller det detaljerade receptet-->
                                <img src="images/pancakes.png" alt="Recept 2: Pannkakor"> <!--bild som representerar receptet-->
                                <figcaption>Recept 2: Pannkakor</figcaption> <!--bildtext som beskriver receptet-->
                            </a>
                        </figure>
                        <figure class="cards">
                            <a href="index.html">
                                <img src="images/pancakes.png" alt="Recept 3: Pannkakor"> <!--bild som representerar receptet-->
                                <figcaption>Recept 3: Pannkakor</figcaption> <!--bildtext som beskriver receptet-->
                            </a>
                        </figure>
                        <figure class="cards">
                            <a href="index.html">
                                <img src="images/pancakes.png" alt="Recept 4: Pannkakor"> <!--bild som representerar receptet-->
                                <figcaption>Recept 4: Pannkakor</figcaption> <!--bildtext som beskriver receptet-->
                            </a>
                        </figure>
                        <figure class="cards">
                            <a href="index.html">
                                <img src="images/pancakes.png" alt="Recept 5: Pannkakor"> <!--bild som representerar receptet-->
                                <figcaption>Recept 5: Pannkakor</figcaption> <!--bildtext som beskriver receptet-->
                            </a>
                        </figure>
                        <figure class="cards">
                            <a href="index.html">
                                <img src="images/pancakes.png" alt="Recept 6: Pannkakor"> <!--bild som representerar receptet-->
                                <figcaption>Recept 6: Pannkakor</figcaption> <!--bildtext som beskriver receptet-->
                            </a>
                        </figure>
                    </section>  
                </article>
            </main>
            <footer class="footer"> <!--sidfot som innehåller copyright-information, med en klass för styling-->
                <p>Copyright &copy; 2026 Samlingssida för recept</p>
            </footer>
        </div>
    </body>
</html>
